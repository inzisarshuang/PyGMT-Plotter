# Deformation and weather auxiliary time series / 形变与气象辅助时序图
# Run from repository root / 在仓库根目录运行：
# conda run -n envPlot python plot_defo_timeseries_aux/plot_defo_timeseries_aux.py \
#   --config plot_defo_timeseries_aux/plot_defo_timeseries_aux.cfg

# Every input is a named two-column table. The first header is date_yyyymmdd;
# second headers are deformation_mm, fitted_deformation_mm,
# precipitation_mm_per_day, and temperature_celsius, respectively.
# 每个输入均为带表头的两列表；首列为 date_yyyymmdd，第二列依次为
# deformation_mm、fitted_deformation_mm、precipitation_mm_per_day 和
# temperature_celsius；日期不得重复。
deformation_file = data/deformation.txt
fit_file = data/deformation_fit.txt
precipitation_file = data/daily_precipitation.txt
temperature_file = data/daily_temperature.txt

# Output paths are resolved relative to this cfg.
# 输出路径相对于本 cfg 所在目录解析。
output_dir = result
output_file = deformation_aux_timeseries.png

# Shared time range and physical ranges of the three independent Y axes.
# 共享时间范围，以及形变、降水、温度三套独立纵轴范围。
date_start = 20170101
date_end = 20220101
projection = X16c/5c

defo_min = -15
defo_max = 15
precip_min = 0
precip_max = 120
temperature_min = 0
temperature_max = 40

# Series colors and axis labels.
# 序列颜色与坐标轴标题。
defo_color = gray20
precip_color = skyblue2
temperature_color = coral1
defo_label = Deformation (mm)
precip_label = Daily precipitation (mm)
temperature_label = Temperature (°C)
time_label = Time (yr)

# Point/line appearance. GMT pen syntax is width,color[,style].
# 点和线样式；GMT pen 格式为宽度、颜色和可选线型。
defo_symbol = t0.13c
defo_pen = 0.5p,gray20
fit_pen = 1p,gray20
precip_pen = 0.04c,skyblue2
temperature_pen = 1p,coral1,-

# Two-level time axis: half-year dates on the primary axis and years below.
# 两级时间轴：主轴标注半年日期，次轴在下方标注年份。
x_primary_frame = pxa6Of3o
x_secondary_frame = sxa1Y
defo_y_frame = ya10f5g10
precip_y_frame = ya30
temperature_y_frame = ya10
primary_time_font = 6p,Helvetica
# Remove the long yearly tick marks and place year labels below the date row.
# 取消年份层长刻度线，并将年份文字下移，避免与半年日期重叠。
secondary_tick_length = 0p
secondary_annot_offset = 18p

# Global typography.
# 全局字体。
default_font_title = 14p,Helvetica-Bold
default_font_annot_primary = 11p,Helvetica
default_font_label = 11p,Helvetica
