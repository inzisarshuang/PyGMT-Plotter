# plot_defo_dem_optic.cfg
#
# 用法 / Usage:
#   conda run -n envPlot python plot_defo_dem_optic.py --config plot_defo_dem_optic.cfg
#
# 路径均相对于本 cfg 文件。未知键、重复键和非法范围会直接报错。
# Paths are relative to this cfg file. Unknown/duplicate keys and invalid ranges fail early.

# =============================================================================
# 1. 输出、投影与可选裁剪范围 / Output, projection, and optional map region
# =============================================================================
output_dir = result
projection = M8i

# 可选路径变量，可在后续路径中写 ${input_dir}；未使用时可不填写。
# input_dir = data

# 四项全部留空时，自动采用形变 GRD 范围；手动设置时必须四项同时填写。
# Leave all four empty to use the deformation grid extent; otherwise set all four.
region_west =
region_east =
region_south =
region_north =

# =============================================================================
# 2. 底图 / Basemaps
# =============================================================================
# 每个数据集可在 *_basemap_mode 中选择 dem 或 optic。
# 对应模式被使用时，下面相应路径为必填。
dem_tif = data/dem.tif
optic_tif = data/optic.tif

dem_cpt = gray
dem_bar_min = 700
dem_bar_max = 2300

# =============================================================================
# 3. 形变显示 / Deformation display
# =============================================================================
# 色带范围只控制显示，不修改源数据。单位应与 *_scale 之后的数据一致。
defo_cpt = ../cpt/saga-01.cpt
defo_cpt_reverse = false
defo_bar_min = -0.06
defo_bar_max = 0.06
defo_transparency = 25
defo_colorbar_label = Deformation
defo_colorbar_unit = m/yr

# defo_mode=scatter 时使用。支持 GMT 符号、画笔和 #RRGGBB 颜色。
scatter_style = c0.08c
scatter_pen = 0.01p,white

# =============================================================================
# 4. SBAS 数据集（必填）/ Required SBAS dataset
# =============================================================================
sbas_input_path = data/SBAS.tif
sbas_input_type = tif
sbas_grd = SBAS.grd

# 写入 GRD 前的数值倍率；例如 mm -> m 可设 0.001。
sbas_scale = 1

# TIF 专用：true 将 nodata/NaN 写为 0；false 保留为空值。
sbas_nan_to_zero = true

# TXT 专用：网格间距（度）和单次读取行数。
sbas_space = 0.0005
sbas_chunk_rows = 250000

sbas_title = Deformation: SBAS
sbas_basemap_mode = optic
sbas_defo_mode = grd
output_sbas = SBAS.png

# =============================================================================
# 5. PSI 数据集（可选）/ Optional PSI dataset
# =============================================================================
# 将 psi_input_path 留空可完全禁用 PSI 图。
psi_input_path = data/PSI.txt
psi_input_type = txt
psi_grd = PSI.grd
psi_scale = 1
psi_nan_to_zero = true
psi_space = 0.0005
psi_chunk_rows = 250000
psi_title = Deformation: PSI
psi_basemap_mode = dem
psi_defo_mode = scatter
output_psi = PSI.png

# =============================================================================
# 6. 地图组件 / Map components
# =============================================================================
add_colorbar = true
add_scale = true
add_rose = true

# GMT map_scale 与面板样式；按研究区尺度调整 +w10k。
map_scale = JTC+o0c/4c+w10k+f+u
map_scale_box = F+gWHITE+p2p+c20p/20p
map_scale_height = 20p
map_scale_font_annot = 20p
map_scale_font_label = 20p,Helvetica-Bold,black

# =============================================================================
# 7. 目标区域标注（可选）/ Optional target-region annotations
# =============================================================================
# 逗号分隔标签。每个标签需定义 target_<标签>_west/east/south/north。
# label_position: top, bottom, left, right, northeast 或 ne。
target_regions =

# 示例（启用时同时将 target_regions = A）：
# target_A_west = -16.75
# target_A_east = -16.65
# target_A_south = 28.20
# target_A_north = 28.30
# target_A_label_position = top

target_region_pen = 1.5p,black
target_region_label_font = 12p,Helvetica-Bold,black
target_region_label_offset = 0.008
target_region_center_style = c0.08c

# =============================================================================
# 8. 字体 / Fonts
# =============================================================================
# default_* 是基础样式，map_* 覆盖地图样式。字体名称须由 GMT 支持。
default_font_title = 24p,Helvetica-Bold
default_font_annot_primary = 12p,Helvetica-Bold
default_font_label = 20p,Helvetica-Bold

map_font_title = 28p,Helvetica-Bold
map_font_annot_primary = 14p,Helvetica-Bold
map_font_label = 28p,Helvetica-Bold

# 兼容旧配置 / Legacy aliases:
# output_defo -> output_sbas
# defo_basemap_mode -> sbas_basemap_mode
# defo_unit -> defo_colorbar_unit
