# plot_defo_dem_profile.cfg
#
# 用法 / Usage:
#   conda run -n envPlot python plot_defo_dem_profile.py --config plot_defo_dem_profile.cfg
#
# 本流程比较两套形变数据，并沿相同剖线输出折线图和散点图。
# This workflow compares two deformation datasets along the same named tracks.
# 所有相对路径均以本 cfg 所在目录为基准。

# =============================================================================
# 1. 地图输出与底图 / Map output and basemap
# =============================================================================
output_dir = result
projection = M8i

dem_tif = data/DEM.tif
dem_cpt = gray
dem_bar_min = 700
dem_bar_max = 2300

defo_cpt = ../cpt/seismic.cpt
defo_cpt_reverse = false
defo_bar_min = -0.1
defo_bar_max = 0.1
defo_transparency = 25
defo_colorbar_label = Deformation
defo_colorbar_unit = m/yr

add_colorbar = true
add_scale = true
add_rose = true

map_scale = JTC+o0c/4c+w10k+f+u
map_scale_box = F+gWHITE+p2p+c20p/20p
map_scale_height = 20p
map_scale_font_annot = 20p
map_scale_font_label = 20p,Helvetica-Bold,black

# =============================================================================
# 2. 数据集 1 / Dataset 1
# =============================================================================
# input_type: tif 或 txt。TIF 使用 nan_to_zero；TXT 使用 space/chunk_rows。
dataset1_label = S1
dataset1_title = Deformation: S1_AS_Norcia
dataset1_input_type = tif
dataset1_input_path = data/S1_AS_Norcia.tif
dataset1_grd = S1_AS_Norcia.grd
dataset1_scale = 1
dataset1_nan_to_zero = true
dataset1_space = 0.003
dataset1_chunk_rows = 250000
dataset1_output_map = S1_AS_Norcia.png

# 剖面折线和散点样式 / Profile line and scatter styles
dataset1_line_pen = 2p,#1f77b4
dataset1_scatter_style = c0.32c
dataset1_scatter_fill = #1f77b4
dataset1_scatter_pen = 0.5p,#1f77b4
dataset1_scatter_transparency = 35

# =============================================================================
# 3. 数据集 2 / Dataset 2
# =============================================================================
dataset2_label = ALOS2
dataset2_title = Deformation: ALOS2_AS
dataset2_input_type = txt
dataset2_input_path = data/ALOS2_AS.txt
dataset2_grd = ALOS2_AS.grd
dataset2_scale = 0.01
dataset2_nan_to_zero = true
dataset2_space = 0.003
dataset2_chunk_rows = 250000
dataset2_output_map = ALOS2_AS.png

dataset2_line_pen = 2p,#d62728
dataset2_scatter_style = t0.34c
dataset2_scatter_fill = #d62728
dataset2_scatter_pen = 0.5p,#d62728
dataset2_scatter_transparency = 35

# =============================================================================
# 4. 剖线与地图标记 / Profile tracks and map marker
# =============================================================================
# 坐标格式：lon,lat; lon,lat。起点、终点和名称数量必须一致。
track_start_coords = 12.97,42.91; 12.97,42.85; 12.97,42.799; 12.97,42.75
track_end_coords = 13.35,42.93; 13.35,42.87; 13.35,42.819; 13.35,42.77
track_names = A,B,C,D
track_num_points = 100

track_line_pen = 2p,black
track_label_font = 20p,Helvetica-Bold
track_start_justify = BR
track_end_justify = BL
track_end_suffix = '

# marker_lon 与 marker_lat 必须同时填写；两者留空可禁用标记。
marker_lon = 13.12
marker_lat = 42.84
marker_style = a16p
marker_pen = 2p,black
marker_fill =

# =============================================================================
# 5. 剖面图 / Profile figures
# =============================================================================
export_line_profiles = true
export_scatter_profiles = true
profile_title_prefix = Profile
profile_x_label = Distance (m)
profile_y_label = Deformation (m)
profile_padding = 0.1
profile_projection = X16c/10c
profile_legend_position = JTR+o0.5c/-1.2c
profile_legend_box = +gwhite+p1.5p

# =============================================================================
# 6. 字体 / Fonts
# =============================================================================
# default_* 为基础样式；map_* 和 profile_* 分别覆盖地图和剖面图。
default_font_title = 24p,Helvetica-Bold
default_font_annot_primary = 12p,Helvetica-Bold
default_font_label = 20p,Helvetica-Bold

map_font_title = 28p,Helvetica-Bold
map_font_annot_primary = 14p,Helvetica-Bold
map_font_label = 28p,Helvetica-Bold

profile_font_title = 20p,Helvetica-Bold
profile_font_annot_primary = 12p,Helvetica
profile_font_label = 16p,Helvetica
